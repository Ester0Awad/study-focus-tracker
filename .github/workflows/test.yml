name: Test

on:
  push:
  pull_request:

jobs:
  logger:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: logger
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: logger/package-lock.json
      - run: npm ci
      - run: npm test
      - name: Replay sample events end to end
        run: |
          npm start -- --replay sample-events.txt
          test -f ../data/sessions.json
